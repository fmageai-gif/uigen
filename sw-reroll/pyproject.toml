[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sw-reroll"
version = "0.1.0"
description = "ADB-driven reroll automation for Summoners War: Sky Arena"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swreroll = "swreroll.cli:main"

[project.gui-scripts]
swreroll-gui = "swreroll.gui:main"

[tool.setuptools]
packages = ["swreroll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
