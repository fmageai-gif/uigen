# Summoners War reroll flow.
#
# THIS FILE IS A STARTING POINT, NOT A FINISHED SCRIPT. The structure and the
# actions are correct; the regions, templates and a few taps must be calibrated
# against YOUR emulator before the loop will run clean. Work through the
# "Calibration" section of the README with `swreroll phase <name>` -- it runs
# exactly one phase at a time so you can fix a step without burning an account.
#
# Guiding principle: prefer `tap_text` over `tap`. Text buttons need no
# captured images at all, which is most of what a tutorial skip has to click.

package: com.com2us.smon.normal.freefull.google.kr.android.common

defaults:
  # This flow keeps by GRADE, not by name: `evaluate_grade` counts the star
  # glyphs and reads the element icon, so "5 stars and light-or-dark" banks
  # the account whoever the monster is. That never goes stale when Com2uS
  # adds an LD5, and it does not depend on OCR reading a stylised name.
  #
  # `wanted` is for `evaluate_names`, and TWO THINGS MAKE IT THE WRONG TOOL
  # for "any LD5" -- both visible on a real result screen:
  #
  #   1. A freshly summoned monster is UNAWAKENED, so the panel shows its
  #      FAMILY name ("Oracle"), not its awakened name ("Praha"). A list of
  #      awakened names matches nothing, ever.
  #   2. Family names are shared across all five elements. There is a fire
  #      Oracle and a light Oracle. So the name alone cannot tell you whether
  #      you have an LD5 at all.
  #
  # Use `evaluate_grade` instead. This list is kept only for the case where
  # you want a specific FAMILY plus the element check, and the names below
  # are family names for that reason.
  wanted:
    - Oracle

  # Phases to skip once the account is already a keeper. `reset` and `wipe`
  # are always protected; mystical scrolls are listed here because once you
  # have your LD5 there is nothing left for them to win.
  skip_on_keep:
    - summon_mystical

order:
  - launch
  - tutorial
  - popups
  - collect
  - summon_ld
  # Delete the next line to skip mystical scrolls -- they cannot roll an LD5.
  - summon_mystical
  - reset

phases:

  # -----------------------------------------------------------------------
  launch:
    steps:
      - start_app: {after: 6}
      # The title screen is the first thing worth waiting on. Capture a crop
      # of the "Touch to Start" text or the logo as templates/ui/title.png.
      - wait_for:
          target: ui/title
          timeout: 120        # cold start on a fresh install pulls a patch
          optional: true
      - tap_through:
          targets: [ui/tutorial_start]
          at: [0.5, 0.85]
          timeout: 90
          optional: true

  # -----------------------------------------------------------------------
  # The opening is on rails: a scripted battle, a scripted first summon, and
  # a lot of dialogue. Hammering through it is the single biggest time sink
  # per account, so this is the phase worth optimising once it works.
  tutorial:
    steps:
      - note: {text: "tutorial"}
      # The opening is ON RAILS: the game accepts a tap only on whatever it
      # is currently highlighting. It does mark that -- but the marks are
      # ambiguous, so nothing here tries to pick THE right one.
      #
      # Each pass taps one candidate: below every arrow found, then through
      # the fixed points. A tap on the wrong thing is free (the game ignores
      # it); a missed tap hangs the account until timeout. So cycling is the
      # safe shape, and the ordering below is only about what is commonest.
      #
      # tap_through stops the instant it can see the next real screen, so a
      # slow patch or a laggy server costs seconds, not a broken run.
      #
      # The arrow floats above its target's head, hence the downward offset.
      # Measured from a real capture: arrow centre y=105, enemy body y=233,
      # so 128px down lands on the monster rather than the arrow.
      - tap_through:
          targets: [ui/summon_altar, ui/battle_start]
          guides:
            # GREEN IS ALWAYS THE TARGET. It marks the enemy to attack, so it
            # is tried first on every pass.
            # Several enemies can carry a green arrow at once, so allow
            # multiple hits and cycle through all of them.
            - {target: ui/arrow_green, offset: [0, 128], region: [0.0, 0.0, 1.0, 0.5], max_hits: 4}
            # The SAME yellow glyph means different things by position. Low
            # on screen it points down at the button the tutorial is telling
            # you to tap -- follow it, and it outranks the skill-3 preference
            # because a scripted step only accepts the skill it names. Up top
            # it is decoration: the next-turn marker over an enemy, or the
            # pointer on the boss HP bar. Hence the bottom-40% scope.
            - {target: ui/arrow_yellow, offset: [0, 95], region: [0.0, 0.6, 1.0, 0.4]}
            # SKIP appears on every cutscene and always ends it early. Matched
            # rather than fixed-tapped so it is still found if a cutscene puts
            # it somewhere else. Optional -- the fixed point below covers it.
            - {target: ui/skip, offset: [0, 0], region: [0.7, 0.8, 0.3, 0.2]}
          points:
            # SKILL 3 FIRST, THEN 2, THEN 1. Skill 3 is the strongest and is
            # what you want whenever it is off cooldown; a tap on a cooling
            # skill is simply ignored, so trying them strongest-first costs
            # nothing and lands the best available one.
            #
            # Note the skill bar belongs to whichever monster is acting, so
            # the icons change between turns -- only the positions are fixed.
            # Dialogue comes first and again mid-cycle: the tutorial is
            # mostly talking, and every dialogue box just needs tapping until
            # it goes away. Off-target taps are free -- during a battle this
            # lands on empty ground, during dialogue the skill taps do
            # nothing -- so the ordering is purely about which is commonest.
            - [0.965, 0.961]  # SKIP -- cutscenes only, always worth tapping
            - [0.495, 0.889]  # dialogue box
            - [0.949, 0.921]  # skill 3  <- preferred
            - [0.848, 0.921]  # skill 2
            - [0.747, 0.921]  # skill 1
            - [0.495, 0.889]  # dialogue box again
            # Enemy positions, for when nothing carries a green arrow -- once
            # the adds are dead only a boss remains, and the arrow that marks
            # it sits high on screen where the yellow guide deliberately does
            # not look. These three cover the whole enemy row.
            - [0.466, 0.404]  # centre / boss
            - [0.335, 0.323]  # left enemy
            - [0.530, 0.323]  # right enemy
          interval: 0.6
          timeout: 300
      - tap_text: {text: "Start", optional: true, timeout: 15}
      - tap_through:
          targets: [ui/home]
          guides:
            # Several enemies can carry a green arrow at once, so allow
            # multiple hits and cycle through all of them.
            - {target: ui/arrow_green, offset: [0, 128], region: [0.0, 0.0, 1.0, 0.5], max_hits: 4}
            - {target: ui/arrow_yellow, offset: [0, 95], region: [0.0, 0.6, 1.0, 0.4]}
            # SKIP appears on every cutscene and always ends it early. Matched
            # rather than fixed-tapped so it is still found if a cutscene puts
            # it somewhere else. Optional -- the fixed point below covers it.
            - {target: ui/skip, offset: [0, 0], region: [0.7, 0.8, 0.3, 0.2]}
          points:
            - [0.965, 0.961]  # SKIP -- cutscenes only, always worth tapping
            - [0.495, 0.889]  # dialogue box
            - [0.949, 0.921]  # skill 3  <- preferred
            - [0.848, 0.921]  # skill 2
            - [0.747, 0.921]  # skill 1
            - [0.495, 0.889]  # dialogue box again
            - [0.466, 0.404]  # centre / boss
            - [0.335, 0.323]  # left enemy
            - [0.530, 0.323]  # right enemy
          interval: 0.6
          timeout: 360

  # -----------------------------------------------------------------------
  # A brand-new account is buried in event banners, pack offers and attendance
  # popups. Every PNG under templates/close/ is treated as a close button.
  popups:
    optional: true
    steps:
      - dismiss: {rounds: 10, interval: 0.7}
      - back: {}
      - dismiss: {rounds: 4, optional: true}

  # -----------------------------------------------------------------------
  # Sweep up everything free before summoning: mailbox, then the Summoner's
  # Way achievement rewards, which is where the early scrolls actually are.
  collect:
    optional: true
    steps:
      - tap: {target: ui/mailbox, timeout: 30, optional: true}
      - tap_text: {text: "Get All", optional: true, timeout: 12, after: 2}
      - tap_text: {text: "OK", optional: true, timeout: 10}
      - dismiss: {rounds: 6, optional: true}
      - back: {}

      - tap: {target: ui/summoners_way, timeout: 20, optional: true}
      - repeat:
          times: 6
          steps:
            - tap_text: {text: "Claim", optional: true, timeout: 6, after: 1.2}
      - dismiss: {rounds: 6, optional: true}
      - back: {}

      # How many scrolls did we actually end up with? Logged per account, so
      # after a hundred rerolls you know what a fresh account is really worth.
      - read_number:
          region: [0.78, 0.02, 0.14, 0.06]
          into: crystals
          optional: true

  # -----------------------------------------------------------------------
  # Light & Darkness scrolls first. These are the ONLY fresh-account source
  # of an LD 5-star, so they are the ones that can actually end the run.
  summon_ld:
    optional: true
    steps:
      - tap: {target: ui/summon_altar, timeout: 45}
      - wait_for: {target: ui/summon_screen, timeout: 30}
      - tap: {target: ui/scroll_ld, timeout: 20}

      # Burn every LD scroll the account has. `optional` on the inner steps
      # means the loop simply stops finding a Summon button once they run out.
      - repeat:
          times: 4
          steps:
            - tap_text: {text: "Summon", optional: true, timeout: 12, after: 1.5}
            - tap_text: {text: "OK", optional: true, timeout: 6}
            - tap_through:
                targets: [ui/summon_result]
                at: [0.5, 0.9]
                interval: 0.7
                timeout: 90
                optional: true
            # The result panel sits on the RIGHT of the screen, not the
            # centre: element icon and name on one row, the star row directly
            # beneath it, stats below that. These regions are ESTIMATED from a
            # cropped screenshot -- tighten both with `swreroll shot --grid`
            # before trusting them.
            - evaluate_grade:
                star_template: ui/star
                star_region: [0.70, 0.28, 0.30, 0.10]
                min_stars: 5
                element_region: [0.69, 0.17, 0.09, 0.11]
                # List ALL FIVE, not just light and dark. Identifying fire
                # positively is what lets the bot wipe a fire nat 5 with
                # confidence -- otherwise "no match" and "not LD" look the
                # same, and a bad crop silently throws away real LD5s.
                elements:
                  light: ui/elem_light
                  dark: ui/elem_dark
                  fire: ui/elem_fire
                  water: ui/elem_water
                  wind: ui/elem_wind
                keep_elements: [light, dark]
                # A nat 5 whose element cannot be read at all is banked, not
                # wiped. Banking a dud costs two minutes; wiping an LD5 costs
                # the run. Set to `discard` only once you trust your crops.
                on_unknown_element: keep
                threshold: 0.86
                save_notable: true
            # The panel's OK button is in the panel, on the right -- a blind
            # centre-bottom tap misses it entirely.
            - tap_text: {text: "OK", timeout: 15, optional: true, after: 1.0}
      - back: {}

  # -----------------------------------------------------------------------
  # Mystical scrolls. NOTE: these can never produce a Light or Dark monster,
  # so under a "keep any LD5" rule they cannot end the run -- they only cost
  # time. `evaluate_grade` still logs any nat 5 they produce (as a note, not
  # a keep) so you can see what the extra minutes are actually buying.
  # Delete this phase from `order` to reclaim that time.
  summon_mystical:
    optional: true
    steps:
      - tap: {target: ui/summon_altar, timeout: 45}
      - wait_for: {target: ui/summon_screen, timeout: 30}
      - tap: {target: ui/scroll_mystical, timeout: 20}
      - repeat:
          times: 3
          steps:
            - tap_text: {text: "Summon", optional: true, timeout: 12, after: 1.5}
            - tap_text: {text: "OK", optional: true, timeout: 6}
            - tap_through:
                targets: [ui/summon_result]
                at: [0.5, 0.9]
                interval: 0.7
                timeout: 90
                optional: true
            # The result panel sits on the RIGHT of the screen, not the
            # centre: element icon and name on one row, the star row directly
            # beneath it, stats below that. These regions are ESTIMATED from a
            # cropped screenshot -- tighten both with `swreroll shot --grid`
            # before trusting them.
            - evaluate_grade:
                star_template: ui/star
                star_region: [0.70, 0.28, 0.30, 0.10]
                min_stars: 5
                element_region: [0.69, 0.17, 0.09, 0.11]
                elements:
                  light: ui/elem_light
                  dark: ui/elem_dark
                  fire: ui/elem_fire
                  water: ui/elem_water
                  wind: ui/elem_wind
                # Mystical scrolls cannot roll light or dark, so a nat 5 here
                # is recorded and the reroll CONTINUES -- only an LD5 stops
                # the run. `discard` on unknown because a mystical pull that
                # reads as light/dark is a detection error, not a jackpot.
                keep_elements: [light, dark]
                on_unknown_element: discard
                threshold: 0.86
                save_notable: true
            - tap_text: {text: "OK", timeout: 15, optional: true, after: 1.0}
      - back: {}

  # -----------------------------------------------------------------------
  # Only reached when nothing was worth keeping. The runner skips this phase
  # entirely once ctx.keep is set, so a hit is never wiped.
  reset:
    steps:
      - clear_data: {after: 3}
